<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BrickCraft — explore a colorful 3D baseplate and build brick by brick." />
  <title>BrickCraft — Build Your World</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='7' y='15' width='50' height='42' rx='7' fill='%23ffd21c'/%3E%3Ccircle cx='20' cy='16' r='7' fill='%23ffea72'/%3E%3Ccircle cx='44' cy='16' r='7' fill='%23ffea72'/%3E%3Cpath d='M7 43h50v8a6 6 0 0 1-6 6H13a6 6 0 0 1-6-6z' fill='%23e8ad00'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" crossorigin href="/assets/index-Y6hX9VcQ.css">
</head>
<body>
  <main id="game" aria-label="BrickCraft 3D building game">
    <canvas id="world" aria-label="Interactive 3D brick building world"></canvas>

    <header class="topbar">
      <a class="brand" href="#" aria-label="BrickCraft home">
        <span class="brand-mark"><i></i><i></i><i></i><i></i></span>
        <span>BRICK<span>CRAFT</span></span>
      </a>
      <div class="project-name"><span class="status-dot"></span> My Brick World <button aria-label="Rename world">✎</button></div>
      <div class="top-actions">
        <button class="icon-button" id="undoBtn" aria-label="Undo last brick" title="Undo (Ctrl+Z)">↶</button>
        <button class="icon-button" id="redoBtn" aria-label="Redo brick" title="Redo (Ctrl+Shift+Z)">↷</button>
        <button class="save-button" id="saveBtn"><span>▣</span> Save World</button>
      </div>
    </header>

    <aside class="palette" aria-label="Brick palette">
      <div class="palette-head">
        <div><p>BUILD MENU</p><h1>Choose a brick</h1></div>
        <button id="collapseBtn" aria-label="Collapse brick menu">‹</button>
      </div>
      <div class="brick-grid" id="brickGrid"></div>
      <div class="color-section">
        <div class="section-label"><h2>Brick color</h2><span id="colorName">Sunny yellow</span></div>
        <div class="colors" id="colors"></div>
      </div>
      <div class="selection-card">
        <div class="mini-brick" id="miniBrick" data-id="2x2"><i></i><i></i><i></i><i></i></div>
        <div><small>SELECTED</small><strong id="selectedLabel">Brick 2 × 2</strong><span>Click the grid to place</span></div>
      </div>
      <button class="detonate-button" id="detonateBtn" disabled><span>✹</span> Detonate TNT</button>
    </aside>

    <div class="mode-tabs" role="group" aria-label="Camera mode">
      <button id="buildMode"><span>⌂</span> Overview</button>
      <button class="active" id="walkMode"><span>♟</span> Walk & Build</button>
    </div>

    <section class="hint" id="hint"><span>✚</span><div><strong>Walk with WASD · click to build</strong><small>Choose a brick on the left · drag to look around</small></div><button aria-label="Dismiss hint">×</button></section>

    <div class="zoom-controls">
      <button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button>
    </div>

    <div class="walk-help" id="walkHelp"><strong>Walk & build mode</strong><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · click or <kbd>E</kbd> to place</span></div>
    <div class="crosshair" id="crosshair" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status">World saved locally!</div>
  </main>
  <script defer src="brickcraft.bundle.js"></script>
</body>
</html>
